# Standard openwashdata _pkgdown.yml configuration, adapted for owdata.
# `url` is the site base URL (canonical links, sitemap.xml, redirects),
# so it must be the Pages URL, never the GitHub repo URL; the repo link
# lives in home.links below.
url: https://openwashdata.github.io/owdata/
template:
  bootstrap: 5
  includes:
    in_header: |
      <script defer data-domain="openwashdata.github.io" src="https://plausible.io/js/script.js"></script>

home:
  links:
    - icon: github
      text: GitHub repository
      href: https://github.com/openwashdata/owdata
  sidebar:
    structure: [links, citation, authors, dev, custom]
    components:
      custom:
        title: Funding
        text: This project was funded by the [Open Research Data Program of the ETH Board](https://ethrat.ch/en/eth-domain/open-research-data/).

authors:
  footer:
    roles: [cre, fnd]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, ctb]

# The reference section is added when the catalog tables ship (issues #5
# and #6): one entry per shipped tibble (owd_packages, owd_datasets,
# owd_variables) and one per exported function.
