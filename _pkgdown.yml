url: https://openwashdata.github.io/owdata
template:
  bootstrap: 5
  includes:
    in_header: |
      <script defer data-domain="openwashdata.github.io" src="https://plausible.io/js/script.js"></script>

home:
  links:
    - icon: github
      text: GitHub repository
      href: https://github.com/openwashdata/owdata
  sidebar:
    structure: [links, citation, authors, dev, custom]
    components:
      custom:
        title: Funding
        text: This project was funded by the [Open Research Data Program of the ETH Board](https://ethrat.ch/en/eth-domain/open-research-data/).

authors:
  footer:
    roles: [cre, fnd]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, ctb]

navbar:
  structure:
    left: [catalog, datasets, variables, policy, reference]
    right: [search, github]
  components:
    catalog:
      text: Catalog
      href: articles/packages.html
    datasets:
      text: Datasets
      href: articles/datasets.html
    variables:
      text: Variables
      href: articles/variables.html
    policy:
      text: Policy
      href: articles/versioning-policy.html

reference:
- title: "Catalog access"
  desc: "Tables of packages, datasets and variables"
  contents:
  - owd_packages
  - owd_datasets
  - owd_variables
- title: "Search and install"
  contents:
  - owd_search
  - owd_install
- title: "Refresh"
  desc: "Update the catalog without reinstalling"
  contents:
  - owd_refresh
