# Weekly catalog harvest. Regenerates the catalog from the openwashdata
# GitHub organisation, runs the schema and content gates, opens or
# updates one pull request with the generated files, and merges it in
# the same run once the gates have passed. The pull request stays as the
# report trail, with the maintainer as assignee. Until 2026-10-31 a
# person merged it; seven unmerged weeks showed that step was the weak
# link (#23).
#
# The built-in GITHUB_TOKEN creates no workflow runs for the events it
# causes: the pull request triggers no pull_request workflows, so the
# gate runs inside this job, and the merge triggers no push workflows,
# so this job dispatches R-CMD-check, pkgdown and test-coverage on main
# by hand. Do not make R-CMD-check a required status on main, or the
# merge step can never succeed.
#
# A failed harvest or gate is red in the Actions tab, opens no pull
# request and merges nothing. There is no failure-issue automation.

name: harvest

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, any::pkgload, any::testthat
          needs: harvest

      # The gate below fails on <U+xxxx> escapes, so the locale matters.
      - name: Run harvest
        env:
          OWD_HARVEST_BACKEND: github
        run: Rscript data-raw/harvest.R

      - name: Regenerate documentation
        run: Rscript -e 'roxygen2::roxygenise()'

      - name: Schema and content gate
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'

      - name: Open or update the harvest pull request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: harvest
          base: main
          add-paths: |
            R/sysdata.rda
            inst/extdata
            data-raw/packages.json
            data-raw/harvest_report.md
            man
            NAMESPACE
            DESCRIPTION
          commit-message: "chore: weekly catalog harvest"
          title: "Weekly catalog harvest"
          body-path: data-raw/harvest_report.md
          assignees: larnsce
          delete-branch: false

      # GitHub computes mergeability after the push, so the first attempt
      # can meet an unknown state; retry for two minutes.
      - name: Merge the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --squash --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::pull request $PR was not merged after six attempts"
          exit 1

      - name: Run the workflows that a token merge does not trigger
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run R-CMD-check.yaml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run pkgdown.yaml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run test-coverage.yaml --ref main --repo "$GITHUB_REPOSITORY"
